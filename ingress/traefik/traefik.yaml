---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress
spec:
  interval: 5m0s
  chart:
    spec:
      # renovate: registryUrl=https://traefik.github.io/charts
      chart: traefik
      version: '42.3.0'
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    ingressClass:
      enabled: true
      name: traefik
      isDefaultClass: false
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: false
      kubernetesIngressNGINX:
        enabled: true
        controllerClass: traefik.io/ingress-controller
        ingressClass: traefik
        publishService:
          enabled: true
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.200
      spec:
        externalTrafficPolicy: Cluster
