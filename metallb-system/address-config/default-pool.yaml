---
{
  "apiVersion": "metallb.io/v1beta1",
  "kind": "IPAddressPool",
  "metadata": {
    "name": "default-pool",
    "namespace": "metallb-system",
    "annotations": {
      "kustomize.toolkit.fluxcd.io/prune": "disabled"
    }
  },
  "spec": {
    "addresses": [
      "192.168.1.200-192.168.1.254"
    ],
    "autoAssign": true,
    "avoidBuggyIPs": false
  }
}
