---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "labels": {
      "app.kubernetes.io/component": "exporter",
      "app.kubernetes.io/name": "blackbox-exporter",
      "app.kubernetes.io/part-of": "kube-prometheus",
      "app.kubernetes.io/version": "0.18.0"
    },
    "name": "blackbox-exporter",
    "namespace": "monitoring",
    "annotations": {
      "deployment.kubernetes.io/revision": "1",
      "kustomize.toolkit.fluxcd.io/prune": "disabled"
    }
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/component": "exporter",
        "app.kubernetes.io/name": "blackbox-exporter",
        "app.kubernetes.io/part-of": "kube-prometheus"
      }
    },
    "strategy": {
      "rollingUpdate": {
        "maxSurge": "25%",
        "maxUnavailable": "25%"
      },
      "type": "RollingUpdate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "kubectl.kubernetes.io/default-container": "blackbox-exporter"
        },
        "labels": {
          "app.kubernetes.io/component": "exporter",
          "app.kubernetes.io/name": "blackbox-exporter",
          "app.kubernetes.io/part-of": "kube-prometheus",
          "app.kubernetes.io/version": "0.18.0"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "--config.file=/etc/blackbox_exporter/config.yml",
              "--web.listen-address=:19115"
            ],
            "image": "quay.io/prometheus/blackbox-exporter:v0.18.0",
            "imagePullPolicy": "IfNotPresent",
            "name": "blackbox-exporter",
            "ports": [
              {
                "containerPort": 19115,
                "name": "http",
                "protocol": "TCP"
              }
            ],
            "resources": {
              "limits": {
                "cpu": "20m",
                "memory": "40Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "20Mi"
              }
            },
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65534
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/etc/blackbox_exporter/",
                "name": "config",
                "readOnly": true
              }
            ]
          },
          {
            "args": [
              "--webhook-url=http://localhost:19115/-/reload",
              "--volume-dir=/etc/blackbox_exporter/"
            ],
            "image": "jimmidyson/configmap-reload:v0.5.0",
            "imagePullPolicy": "IfNotPresent",
            "name": "module-configmap-reloader",
            "resources": {
              "limits": {
                "cpu": "20m",
                "memory": "40Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "20Mi"
              }
            },
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65534
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "FallbackToLogsOnError",
            "volumeMounts": [
              {
                "mountPath": "/etc/blackbox_exporter/",
                "name": "config",
                "readOnly": true
              }
            ]
          },
          {
            "args": [
              "--logtostderr",
              "--secure-listen-address=:9115",
              "--tls-cipher-suites=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305",
              "--upstream=http://127.0.0.1:19115/"
            ],
            "image": "quay.io/brancz/kube-rbac-proxy:v0.8.0",
            "imagePullPolicy": "IfNotPresent",
            "name": "kube-rbac-proxy",
            "ports": [
              {
                "containerPort": 9115,
                "name": "https",
                "protocol": "TCP"
              }
            ],
            "resources": {
              "limits": {
                "cpu": "20m",
                "memory": "40Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "20Mi"
              }
            },
            "securityContext": {
              "runAsGroup": 65532,
              "runAsNonRoot": true,
              "runAsUser": 65532
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "nodeSelector": {
          "kubernetes.io/os": "linux"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "serviceAccount": "blackbox-exporter",
        "serviceAccountName": "blackbox-exporter",
        "terminationGracePeriodSeconds": 30,
        "volumes": [
          {
            "configMap": {
              "defaultMode": 420,
              "name": "blackbox-exporter-configuration"
            },
            "name": "config"
          }
        ]
      }
    }
  }
}
