---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-home-assistant
  namespace: monitoring
data:
  home-assistant.json: |
    {
      "uid": "home-assistant-temperatures",
      "title": "Home Assistant Temperatures",
      "description": "Ecobee indoor and Pirate Weather outdoor temperatures pushed through the OpenTelemetry Collector.",
      "tags": [
        "home-assistant",
        "temperature"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ecobee temperature",
          "description": "Latest temperature reported in the last 24 hours. Updates are pushed by Home Assistant.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "last_over_time({source=\"homeassistant\",entity_id=\"ecobee_temperature\"}[24h])",
              "legendFormat": "Ecobee",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pirate Weather temperature",
          "description": "Latest temperature reported in the last 24 hours. Updates are pushed by Home Assistant.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "last_over_time({source=\"homeassistant\",entity_id=\"pirate_weather_temperature\"}[24h])",
              "legendFormat": "Pirate Weather",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Indoor and outdoor temperature",
          "description": "Last reported temperatures, carried forward for up to 24 hours between state changes. No samples are collected by scraping.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "auto",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "last_over_time({source=\"homeassistant\",entity_id=\"ecobee_temperature\"}[24h])",
              "legendFormat": "Ecobee",
              "refId": "A",
              "instant": false,
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "last_over_time({source=\"homeassistant\",entity_id=\"pirate_weather_temperature\"}[24h])",
              "legendFormat": "Pirate Weather",
              "refId": "B",
              "instant": false,
              "range": true
            }
          ]
        }
      ]
    }
