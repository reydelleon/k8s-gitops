---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-home
  namespace: monitoring
data:
  home.json: |
    {
      "uid": "home",
      "title": "Home Overview",
      "description": "Outdoor and individual room temperatures.",
      "tags": [
        "home",
        "temperature"
      ],
      "schemaVersion": 39,
      "version": 5,
      "editable": false,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "room",
            "label": "Room",
            "type": "custom",
            "query": "Outside : outside,Main Hallway : main_hallway,Master Bedroom : master_bedroom,Office : office,Playroom : playroom",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": [
              {
                "text": "All",
                "value": "$__all",
                "selected": true
              },
              {
                "text": "Outside",
                "value": "outside",
                "selected": false
              },
              {
                "text": "Main Hallway",
                "value": "main_hallway",
                "selected": false
              },
              {
                "text": "Master Bedroom",
                "value": "master_bedroom",
                "selected": false
              },
              {
                "text": "Office",
                "value": "office",
                "selected": false
              },
              {
                "text": "Playroom",
                "value": "playroom",
                "selected": false
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Temperatures around home",
          "description": "Outdoor temperature and individual room sensors. Only readings reported within the preceding 30 minutes are shown; unavailable sensors are omitted.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 11,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^outside \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Outside \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^main_hallway \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Main Hallway \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^master_bedroom \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Master Bedroom \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^office \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Office \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^playroom \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Playroom \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^outside \u00b7 .*"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        5
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 3
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "last_over_time({__name__=\"home.temperature\",\"home.room.name\"=~\"${room:regex}\"}[30m])",
              "legendFormat": "{{home.room.name}} \u00b7 {{home.sensor.source}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Humidity around home",
          "description": "Indoor and outdoor relative humidity. Only readings reported within the preceding 30 minutes are shown; unavailable sensors are omitted.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 11,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0,
              "max": 100
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^outside \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Outside \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^main_hallway \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Main Hallway \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^playroom \u00b7 (.*)$"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Playroom \u00b7 ${__field.labels[\"home.sensor.source\"]}"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^outside \u00b7 .*"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        5
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 3
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "last_over_time({__name__=\"home.humidity\",\"home.room.name\"=~\"${room:regex}\"}[30m])",
              "legendFormat": "{{home.room.name}} \u00b7 {{home.sensor.source}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 3,
          "type": "text",
          "title": "Reading the charts",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 11
          },
          "options": {
            "mode": "markdown",
            "content": "The dashed outdoor lines are Pirate Weather. The office has separate Ecobee and Echo temperature readings. Sensors without a reading in the last 30 minutes are omitted rather than shown as zero."
          }
        }
      ]
    }
