---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-prometheus-datasource
  namespace: monitoring
  labels:
    grafana-datasource: "1"
type: Opaque
stringData:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://vmsingle-metrics.monitoring.svc.cluster.local:8428
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          prometheusType: Prometheus
          prometheusVersion: 2.26.0
          timeInterval: 30s
