---
{
  "apiVersion": "cert-manager.io/v1",
  "kind": "ClusterIssuer",
  "metadata": {
    "name": "letsencrypt-staging",
    "annotations": {
      "kustomize.toolkit.fluxcd.io/prune": "disabled"
    }
  },
  "spec": {
    "acme": {
      "email": "contact@reydelleon.me",
      "preferredChain": "",
      "privateKeySecretRef": {
        "name": "letsencrypt-staging"
      },
      "server": "https://acme-staging-v02.api.letsencrypt.org/directory",
      "solvers": [
        {
          "http01": {
            "ingress": {
              "class": "nginx"
            }
          },
          "selector": {
            "matchLabels": {
              "use-http01-solver": "true"
            }
          }
        },
        {
          "dns01": {
            "digitalocean": {
              "tokenSecretRef": {
                "key": "access-token",
                "name": "digitalocean-dns"
              }
            }
          },
          "selector": {
            "dnsZones": [
              "leonmachado.com"
            ]
          }
        }
      ]
    }
  }
}
