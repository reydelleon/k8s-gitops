---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: default
spec:
  interval: 5m0s
  chart:
    spec:
      # renovate: registryUrl=https://reydelleon.github.io/helm-charts/
      chart: sonarr
      version: '>=3.0.0 <4.0.0'
      sourceRef:
        kind: HelmRepository
        name: personal-charts
        namespace: flux-system
      interval: 5m0s
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: networking.k8s.io
              version: v1
              kind: Ingress
              name: sonarr
            patch: |
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: sonarr
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
              spec:
                tls:
                  - secretName: sonarr-tls
                    hosts:
                      - sonarr.leonmachado.com
          - target:
              version: v1
              kind: PersistentVolume
              name: sonarr-config
            patch: |
              apiVersion: v1
              kind: PersistentVolume
              metadata:
                name: sonarr-config
              spec:
                nodeAffinity:
                  required:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values:
                              - homeserver
          - target:
              version: v1
              kind: PersistentVolume
              name: sonarr-media
            patch: |
              apiVersion: v1
              kind: PersistentVolume
              metadata:
                name: sonarr-media
              spec:
                nodeAffinity:
                  required:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values:
                              - homeserver
  values:
    image:
      repository: linuxserver/sonarr
      tag: 4.0.20

    ingress:
      ingressClassName: traefik
      host: sonarr.leonmachado.com
      path: /
      pathType: ImplementationSpecific

    persistence:
      media:
        hostPath: /var/lib/media
        size: 500Gi
