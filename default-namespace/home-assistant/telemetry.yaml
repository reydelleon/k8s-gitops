---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-telemetry
  namespace: default
data:
  telemetry.yaml: |
    template:
      - sensor:
          - name: Pirate Weather Temperature
            unique_id: pirate_weather_temperature_telemetry
            device_class: temperature
            state_class: measurement
            unit_of_measurement: "°F"
            availability: "{{ is_number(state_attr('weather.pirateweather', 'temperature')) }}"
            state: "{{ state_attr('weather.pirateweather', 'temperature') }}"
          - name: Pirate Weather Humidity
            unique_id: pirate_weather_humidity_telemetry
            device_class: humidity
            state_class: measurement
            unit_of_measurement: "%"
            availability: "{{ is_number(state_attr('weather.pirateweather', 'humidity')) }}"
            state: "{{ state_attr('weather.pirateweather', 'humidity') }}"

    influxdb:
      max_retries: 3
      measurement_attr: entity_id
      tags:
        source: homeassistant
      tags_attributes:
        - unit_of_measurement
      include:
        entities:
          - sensor.ecobee_temperature
          - sensor.master_bedroom_echo_temperature
          - sensor.office_temperature
          - sensor.office_echo_temperature
          - sensor.basement_temperature
          - sensor.pirate_weather_temperature
          - sensor.ecobee_humidity
          - sensor.basement_humidity
          - sensor.pirate_weather_humidity
      ignore_attributes:
        - friendly_name
        - unit_of_measurement
        - device_class
        - state_class
        - icon
        - attribution
