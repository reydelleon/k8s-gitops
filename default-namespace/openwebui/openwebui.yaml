---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: default
spec:
  interval: 5m0s
  timeout: 30m0s
  chart:
    spec:
      chart: open-webui
      version: '>=5.0.0 <6.0.0'
      sourceRef:
        kind: HelmRepository
        name: openwebui-charts
        namespace: flux-system
      interval: 5m0s
  values:
    image:
      tag: v0.13.0
    ollama:
      enabled: true
      image:
        tag: 0.40.15
      updateStrategy:
        type: Recreate
      persistentVolume:
        enabled: true
        storageClass: longhorn
        size: 12Gi
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
        limits:
          cpu: 8000m
          memory: 16Gi
      extraEnv:
        - name: OLLAMA_CONTEXT_LENGTH
          value: "4096"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "2"
        - name: OLLAMA_KEEP_ALIVE
          value: 30m
      ollama:
        models:
          pull:
            - llama3.2:3b
            - moondream:1.8b
          run: []
          create:
            - name: ha-text
              template: |
                FROM llama3.2:3b
                PARAMETER num_ctx 4096
                PARAMETER num_thread 8
                PARAMETER temperature 0.2
            - name: ha-vision
              template: |
                FROM moondream:1.8b
                PARAMETER num_ctx 2048
                PARAMETER num_thread 8
                PARAMETER temperature 0.1
    pipelines:
      enabled: false
    hostNetwork: true
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 4Gi
        cpu: 2000m
    extraEnvVars:
      - name: DEFAULT_MODELS
        value: ha-text
    ingress:
      enabled: true
      class: traefik
      host: ai.leonmachado.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls: true
      existingSecret: openwebui-tls
    # persistentVolume:
    #   enabled: true
    #   storageClass: longhorn
    #   size: 30Gi
    
