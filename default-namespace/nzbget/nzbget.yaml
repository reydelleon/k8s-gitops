---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nzbget
  namespace: default
spec:
  interval: 5m0s
  chart:
    spec:
      # renovate: registryUrl=https://reydelleon.github.io/helm-charts/
      chart: nzbget
      version: '>=3.0.0 <4.0.0'
      sourceRef:
        kind: HelmRepository
        name: personal-charts
        namespace: flux-system
      interval: 5m0s
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: networking.k8s.io
              version: v1
              kind: Ingress
              name: nzbget
            patch: |
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: nzbget
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-prod
              spec:
                tls:
                  - secretName: nzbget-tls
                    hosts:
                      - nzbget.leonmachado.com
  values:
    image:
      repository: linuxserver/nzbget
      tag: version-v26.3

    ingress:
      ingressClassName: traefik
      host: nzbget.leonmachado.com
      path: /
      pathType: ImplementationSpecific

    persistence:
      downloads:
        storageClassName: manual
        hostPath: /var/lib/media/plex-library/Downloads
        mountPath: /media/Downloads
        size: 500Gi
