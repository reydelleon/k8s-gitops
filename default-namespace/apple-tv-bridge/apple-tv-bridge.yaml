---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apple-tv-bridge
  namespace: default
spec:
  interval: 5m0s
  chart:
    spec:
      # renovate: registryUrl=https://reydelleon.github.io/helm-charts/
      chart: apple-tv-bridge
      version: '>=0.1.0 <1.0.0'
      sourceRef:
        kind: HelmRepository
        name: personal-charts
        namespace: flux-system
      interval: 5m0s
  values:
    image:
      repository: ghcr.io/reydelleon/apple-tv-bridge
      tag: latest
      pullPolicy: Always
    imagePullSecrets:
      - name: ghcr-pull-secret
    hostNetwork: true
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.1.204
    persistence:
      storageClass: longhorn
      size: 1Gi
    config:
      auto_discover: true
      devices: []
